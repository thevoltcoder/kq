[package]
name = "kq"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
debug = false
incremental = false

[dependencies]
anyhow = "1.0.104"
block2 = "0.6.2"
coreaudio-sys = "0.2.18"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-audio-toolbox = "0.3.2"
objc2-avf-audio = { version = "0.3.2", features = ["objc2-audio-toolbox"] }
objc2-core-audio-kit = { version = "0.3.2", features = ["AUGenericView", "objc2-app-kit", "objc2-audio-toolbox"] }
objc2-foundation = "0.3.2"
rfd = "0.18.0"
